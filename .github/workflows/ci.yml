name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deterministic_task_cache:
        description: "Opt in to the reviewed static repository inventory output cache (never test acceptance)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      host: ${{ steps.detect.outputs.host }}
      native: ${{ steps.detect.outputs.native }}
      rpm: ${{ steps.detect.outputs.rpm }}
      browser: ${{ steps.detect.outputs.browser }}
      scripts: ${{ steps.detect.outputs.scripts }}
      python: ${{ steps.detect.outputs.python }}
      source_sha: ${{ steps.detect.outputs.source_sha }}
      windows_runs_on: ${{ steps.windows-runner.outputs.windows_runs_on }}
      windows_self_hosted: ${{ steps.windows-runner.outputs.windows_self_hosted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
          install: "false"
      - id: detect
        name: Select dependent checks (full coverage if diff is unavailable)
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: node scripts/checks/ci-changes.mjs --ci --base "$CI_BASE" --github-output "$GITHUB_OUTPUT"
      - id: windows-runner
        name: Route trusted Windows work (PRs and disabled opt-in stay hosted)
        env:
          WINDOWS_SELF_HOSTED_OPT_IN: ${{ vars.BYCODA_WINDOWS_SELF_HOSTED }}
        run: node scripts/checks/windows-runner-policy.mjs --scope ci

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
      - run: node scripts/checks/check-repository-hygiene.mjs
      - run: node --test .github/scripts/issue-labels.test.cjs
      - name: Repository quality gates (format, lint baseline, locales, feature skills, theme colors, UI drift)
        run: |
          pnpm format:check
          pnpm lint:baseline
          pnpm check:locales
          pnpm check:feature-skills
          pnpm check:colors
          pnpm check:ui-drift

  preflight:
    # Deterministic contract/format failures stop expensive VM builds and browser
    # matrices before they start, without replacing their test evidence.
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
          install: ${{ needs.changes.outputs.web }}
      - name: Verify shared Host contracts and headless boundaries
        if: needs.changes.outputs.web == 'true'
        run: |
          node scripts/checks/check-host-contracts.mjs
          node scripts/checks/check-host-runtime-boundaries.mjs
          node scripts/checks/check-host-headless-boundaries.mjs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.changes.outputs.native == 'true' || needs.changes.outputs.rpm == 'true'
        with:
          components: rustfmt
      - name: Check Rust formatting once before native builds
        if: needs.changes.outputs.native == 'true' || needs.changes.outputs.rpm == 'true'
        run: cargo fmt --all --check

  host:
    needs: [changes, preflight]
    if: github.event_name != 'pull_request' || needs.changes.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Hosted shards get independent VMs. Opt-in isolated Windows work shares
        # one non-cancelling queue; Linux/macOS retain their hosted parallelism.
        include:
          # Reviewed portable graphs run once inside Linux's full scope. Any
          # source drift returns them to integration on every OS automatically.
          - { os: ubuntu-latest, scope: all, shard: 1, shard-count: 1 }
          - { os: macos-latest, scope: integration, shard: 1, shard-count: 2 }
          - { os: macos-latest, scope: integration, shard: 2, shard-count: 2 }
          - { os: windows-latest, scope: integration, shard: 1, shard-count: 6 }
          - { os: windows-latest, scope: integration, shard: 2, shard-count: 6 }
          - { os: windows-latest, scope: integration, shard: 3, shard-count: 6 }
          - { os: windows-latest, scope: integration, shard: 4, shard-count: 6 }
          - { os: windows-latest, scope: integration, shard: 5, shard-count: 6 }
          - { os: windows-latest, scope: integration, shard: 6, shard-count: 6 }
    env:
      BYCODA_HOST_TEST_SCOPE: ${{ matrix.scope }}
    runs-on: ${{ matrix.os == 'windows-latest' && fromJSON(needs.changes.outputs.windows_runs_on) || matrix.os }}
    concurrency:
      group: ${{ matrix.os == 'windows-latest' && needs.changes.outputs.windows_self_hosted == 'true' && 'bycoda-windows-heavy' || format('ci-host-{0}-{1}-{2}-{3}', github.run_id, github.run_attempt, matrix.os, matrix.shard) }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify isolated Windows admission and persistent cache roots
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/setup/windows-runner.ps1 -Mode Verify -Purpose ci -ExportEnvironment
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
      - name: Verify Host test shard coverage
        if: matrix.shard == 1
        run: node scripts/checks/check-host-test-shards.mjs ${{ matrix.shard-count }}
      - name: Resolve this shard's runtime requirements
        id: host-environment
        run: node scripts/checks/host-test-environment.mjs ${{ matrix.shard }} ${{ matrix.shard-count }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.host-environment.outputs.chromium == 'true'
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: host-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium only for shards that exercise the real browser
        if: steps.host-environment.outputs.chromium == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Host test shard
        run: >-
          pnpm run test:host --shard=${{ matrix.shard }}/${{ matrix.shard-count }}
          --reporter=default --reporter=json
          --outputFile.json=temp/test-results/host-ci/results.json
      # test:host's pretest hook already typechecks and builds the host.
      - run: node host/package.mjs
        if: matrix.shard == 1
      - name: Record shard source and result
        if: always()
        run: >-
          node scripts/checks/ci-results.mjs record --job host
          --variant ${{ matrix.os }}-${{ matrix.shard }}-of-${{ matrix.shard-count }}
          --result ${{ job.status }} --directory temp/test-results/ci-evidence
          --require temp/test-results/host-ci/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-host-${{ matrix.os }}-${{ matrix.shard }}
          path: temp/test-results/ci-evidence/*.json
          if-no-files-found: error
      - name: Upload Host test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-tests-${{ matrix.os }}-${{ matrix.shard }}-of-${{ matrix.shard-count }}
          path: temp/test-results/host-ci/results.json
          if-no-files-found: warn

  web:
    needs: [changes, preflight]
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
      - name: Check workspace package boundaries and normal package types
        run: |
          pnpm run check:packages
          pnpm run typecheck:packages
      - name: Check code invariants ratchet
        run: pnpm run check:invariants
      - run: pnpm test --reporter=default --reporter=json --outputFile.json=temp/test-results/web-ci/results.json
      - run: pnpm exec tsc-rs --noEmit
      - id: playwright
        name: Read pinned web boot browser version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: browser-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and mount the actual production web entry (no Tauri mock)
        run: >-
          node scripts/checks/browser-built-boot.mjs --build
          --dist temp/build/web-ci/dist --boundary native-unavailable
          --output temp/test-results/web-ci/boot
          --receipt temp/test-results/web-ci/boot.json
      - name: Record web source and result
        if: always()
        run: >-
          node scripts/checks/ci-results.mjs record --job web --variant linux
          --result ${{ job.status }} --directory temp/test-results/ci-evidence
          --require temp/test-results/web-ci/results.json
          --web-receipt temp/test-results/web-ci/boot.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-web
          path: temp/test-results/ci-evidence/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-test-results
          path: temp/test-results/web-ci/

  check:
    needs: [changes, preflight]
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os == 'windows-latest' && fromJSON(needs.changes.outputs.windows_runs_on) || matrix.os }}
    concurrency:
      group: ${{ matrix.os == 'windows-latest' && needs.changes.outputs.windows_self_hosted == 'true' && 'bycoda-windows-heavy' || format('ci-native-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.os) }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify isolated Windows admission and persistent cache roots
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/setup/windows-runner.ps1 -Mode Verify -Purpose ci -ExportEnvironment
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
          install: "false"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup/install-linux-deps-debian.sh --sources /etc/apt/sources.list.d/ubuntu.sources

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.environment != 'self-hosted'
        with:
          key: native-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
      - name: Record native source and result
        if: always()
        run: >-
          node scripts/checks/ci-results.mjs record --job check --variant ${{ matrix.os }}
          --result ${{ job.status }} --directory temp/test-results/ci-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-native-${{ matrix.os }}
          path: temp/test-results/ci-evidence/*.json
          if-no-files-found: error

  rpm:
    needs: [changes, preflight]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rpm == 'true'
    name: RPM build (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # almalinux:10 covers the Enterprise Linux path in
        # scripts/setup/install-linux-deps-fedora.sh (EPEL 10 + CRB), which is the
        # only way to catch packages that are missing from EPEL 10.
        image: [fedora:43, almalinux:10]
    steps:
      # Neither fedora:43 nor almalinux:10 ships git, which actions/checkout
      # otherwise has to work around with a REST API tarball download.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: bash scripts/setup/install-linux-deps-fedora.sh

      - uses: ./.github/actions/setup-deps
        with:
          # Keep the package runtime separate from Node 24 source/test jobs.
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rpm-${{ matrix.image }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm run build:fedora

      - name: Install the generated rpm
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(target/release/bundle/rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          # tauri-bundler derives rpm Requires only from
          # bundle.linux.rpm.depends, so assert the runtime stack is declared.
          # The install below cannot prove this on its own: the setup script has
          # already installed every -devel package.
          requires="$(rpm -qp --requires "${bundle[0]}")"
          echo "$requires"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3 librsvg2 openssl-libs; do
            if ! grep -qx "$dep" <<<"$requires"; then
              echo "rpm is missing Requires: $dep" >&2
              exit 1
            fi
          done
          dnf install -y "${bundle[0]}"
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          command -v bycoda

      - name: Upload rpm for the clean install check
        # Ship and test the EL 10 build. Fedora 43's glibc is newer, so a
        # fedora:43 rpm can dnf-install on AlmaLinux 10 and still fail to load.
        if: matrix.image == 'almalinux:10'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-package
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Record RPM source and result
        if: always()
        run: >-
          node scripts/checks/ci-results.mjs record --job rpm --variant ${{ matrix.image }}
          --result ${{ job.status }} --directory temp/test-results/ci-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-rpm-${{ strategy.job-index }}
          path: temp/test-results/ci-evidence/*.json
          if-no-files-found: error

  rpm-clean-install:
    name: Clean rpm install
    needs: rpm
    runs-on: ubuntu-latest
    # Deliberately no setup script: this is the only job that can catch an rpm
    # whose Requires are missing, since everywhere else the -devel packages are
    # already installed. It mirrors the README instructions for an EL 10 user.
    # ldd -r is the loader check: dnf install succeeding does not prove the
    # binary can resolve against EL 10's glibc and runtime libraries.
    container: almalinux:10
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable EPEL 10
        run: dnf install -y epel-release

      - uses: ./.github/actions/setup-deps
        with:
          node-version: 22
          install: "false"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rpm-package
          path: rpm

      - name: Install the rpm on a clean image
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=(rpm/*.rpm)
          if (( ${#bundle[@]} != 1 )); then
            echo "Expected exactly one .rpm" >&2
            exit 1
          fi
          dnf install -y "${bundle[0]}"
          for dep in webkit2gtk4.1 gtk3 libappindicator-gtk3; do
            rpm -q "$dep" >/dev/null || { echo "dnf did not install $dep" >&2; exit 1; }
          done
          rpm -q "$(rpm -qp --queryformat '%{NAME}' "${bundle[0]}")"
          test -x /usr/bin/bycoda
          # ldd -r can exit non-zero on GTK/WebKit plugin symbols; fail only
          # when a library or GLIBC version is actually missing.
          loader_output="$(ldd -r /usr/bin/bycoda 2>&1 || true)"
          printf '%s\n' "$loader_output"
          if grep -q 'not found' <<<"$loader_output"; then
            echo "bycoda cannot load on EL 10" >&2
            exit 1
          fi
      - name: Record clean installation source and result
        if: always()
        run: >-
          node scripts/checks/ci-results.mjs record --job rpm-clean-install --variant linux
          --result ${{ job.status }} --directory temp/test-results/ci-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-rpm-clean-install
          path: temp/test-results/ci-evidence/*.json
          if-no-files-found: error

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
      - id: inventory-cache-key
        name: Identify complete deterministic inventory inputs (explicit main-branch opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.deterministic_task_cache && github.ref == 'refs/heads/main'
        run: node scripts/checks/task-cache.mjs key --task repository-inventory
      - id: inventory-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.inventory-cache-key.outcome == 'success'
        with:
          path: temp/task-cache
          key: deterministic-inventory-${{ runner.os }}-${{ runner.arch }}-${{ steps.inventory-cache-key.outputs.key }}
      - name: Execute or rehash restored static inventory (no test result cache)
        if: steps.inventory-cache-key.outcome == 'success'
        run: >-
          node scripts/checks/task-cache.mjs run --task repository-inventory
          --store temp/task-cache --output temp/test-results/scripts-ci/cached-inventory
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && steps.inventory-cache-key.outcome == 'success' && steps.inventory-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: temp/task-cache
          key: deterministic-inventory-${{ runner.os }}-${{ runner.arch }}-${{ steps.inventory-cache-key.outputs.key }}
      - name: Run maintained script fixtures (no app build or installation)
        run: >-
          node scripts/checks/check-local.mjs --scripts --run --timeout-ms 600000
          --report temp/test-results/scripts-ci/results.json
      - name: Typecheck the offline evaluation harness
        run: pnpm run eval:check
      - name: Check offline model behavior graders (no provider calls)
        run: >-
          pnpm run eval:offline --reporter=default --reporter=json
          --outputFile.json=temp/test-results/scripts-ci/evals.json
      - name: Record script source and result
        if: always()
        run: >-
          node scripts/checks/ci-results.mjs record --job scripts --variant linux
          --result ${{ job.status }} --directory temp/test-results/ci-evidence
          --require temp/test-results/scripts-ci/results.json
          --require temp/test-results/scripts-ci/evals.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-scripts
          path: temp/test-results/ci-evidence/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: script-test-results
          path: temp/test-results/scripts-ci/

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
          install: "false"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run local-update fixtures without live updates
        shell: bash
        run: |
          mkdir -p temp/test-results/python-ci
          set -o pipefail
          python -B -m unittest discover -s scripts/local-update -p test_local_update.py -v 2>&1 | tee temp/test-results/python-ci/results.log
      - name: Record Python source and result
        if: always()
        run: >-
          node scripts/checks/ci-results.mjs record --job python --variant ${{ matrix.os }}
          --result ${{ job.status }} --directory temp/test-results/ci-evidence
          --require temp/test-results/python-ci/results.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-python-${{ matrix.os }}
          path: temp/test-results/ci-evidence/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-test-results-${{ matrix.os }}
          path: temp/test-results/python-ci/

  browser:
    needs: [changes, preflight]
    if: github.event_name == 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    env:
      BYCODA_BROWSER_ARTIFACT_DIR: temp/test-results/browser-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
      - name: Verify every browser fixture has one owner
        run: node scripts/checks/browser-test-inventory.mjs --check
      - name: Typecheck all maintained browser configs (normal tsc-rs)
        run: pnpm exec tsc-rs --noEmit -p tests/browser/tsconfig.json
      - id: playwright
        name: Read pinned Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: browser-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install the pinned Chromium runtime and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the isolated browser smoke fixture
        run: node scripts/checks/browser-tests.mjs --suite smoke --project chromium
      - name: Record browser fixture source and result
        if: always()
        run: >-
          node scripts/checks/ci-results.mjs record --job browser --variant chromium-smoke
          --result ${{ job.status }} --directory temp/test-results/ci-evidence
          --browser-receipt temp/test-results/browser-ci/run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-browser
          path: temp/test-results/ci-evidence/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-fixture-results
          path: temp/test-results/browser-ci/

  browser-full:
    name: Browser full (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.count }})
    needs: [changes, preflight]
    if: github.event_name != 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { project: chromium, shard: 1, count: 6 }
          - { project: chromium, shard: 2, count: 6 }
          - { project: chromium, shard: 3, count: 6 }
          - { project: chromium, shard: 4, count: 6 }
          - { project: chromium, shard: 5, count: 6 }
          - { project: chromium, shard: 6, count: 6 }
          - { project: webkit, shard: 1, count: 4 }
          - { project: webkit, shard: 2, count: 4 }
          - { project: webkit, shard: 3, count: 4 }
          - { project: webkit, shard: 4, count: 4 }
    env:
      BYCODA_BROWSER_ARTIFACT_DIR: temp/test-results/browser-full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
      - name: Verify full collection ownership and normal browser config types
        run: |
          node scripts/checks/browser-test-inventory.mjs --check
          pnpm exec tsc-rs --noEmit -p tests/browser/tsconfig.json
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: browser-${{ matrix.project }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - name: Execute all assigned owners and deliberate alternate fixtures
        run: >-
          node scripts/checks/browser-tests.mjs --include-variants
          --project ${{ matrix.project }} --shard ${{ matrix.shard }}/${{ matrix.count }}
      - name: Bind every discovered and executed report to this exact source partition
        if: always()
        run: >-
          node scripts/checks/ci-results.mjs record --job browser-full
          --variant ${{ matrix.project }}-${{ matrix.shard }}-of-${{ matrix.count }}
          --result ${{ job.status }} --directory temp/test-results/ci-evidence
          --browser-receipt temp/test-results/browser-full/run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-browser-${{ matrix.project }}-${{ matrix.shard }}
          path: temp/test-results/ci-evidence/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-full-${{ matrix.project }}-${{ matrix.shard }}
          path: temp/test-results/browser-full/

  complete:
    name: Check
    if: always()
    needs:
      [
        changes,
        repository-hygiene,
        preflight,
        web,
        host,
        check,
        rpm,
        rpm-clean-install,
        scripts,
        python,
        browser,
        browser-full,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
          install: "false"
      - name: Download data-only evidence from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: ci-evidence-*
          merge-multiple: true
          path: temp/test-results/ci-evidence-collected
      - name: Require selected jobs and their exact-source evidence
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/checks/ci-results.mjs check --directory temp/test-results/ci-evidence-collected
