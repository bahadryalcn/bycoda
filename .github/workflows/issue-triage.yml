name: Issue triage

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const catalog = require('./.github/issue-labels.json');
            const { labelsForIssue, ensureLabels } = require('./.github/scripts/issue-labels.cjs');
            const issue = context.payload.issue;
            const labels = issue ? labelsForIssue(issue, catalog) : [];
            const definitions = issue
              ? catalog.labels.filter(label => labels.includes(label.name))
              : catalog.labels;
            await ensureLabels(github, context.repo, definitions);
            if (issue && labels.length) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels,
              });
            }
