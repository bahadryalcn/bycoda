name: Issue triage

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - .github/issue-labels.json
      - .github/scripts/issue-labels.cjs
      - .github/workflows/issue-triage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const catalog = require('./.github/issue-labels.json');
            const { labelsForIssue, ensureLabels } = require('./.github/scripts/issue-labels.cjs');
            const issue = context.payload.issue;
            const labels = issue ? labelsForIssue(issue, catalog) : [];
            const definitions = issue
              ? catalog.labels.filter(label => labels.includes(label.name))
              : catalog.labels;
            await ensureLabels(github, context.repo, definitions);
            if (issue && labels.length) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels,
              });
            }
