name: Release

# Push a vX.Y.Z tag that matches package.json. The workflow builds signed updater
# artifacts for review. The separate owner-dispatched release-publish workflow
# rechecks the completed producer and exact package receipts before publication.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require full CI at the exact release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release-candidate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: temp/test-results/release-candidate/candidate.json
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: source-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: version
        name: Check tag, version files and release notes
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          for file in src-tauri/tauri.conf.json; do
            [ "$(node -p "require('./${file}').version")" = "${version}" ] || { echo "::error::${file} version differs"; exit 1; }
          done
          awk -v v="## [${version}]" 'index($0, v) == 1 {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no notes for ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - id: create
        name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = "true" || { echo "::error::Release is already public"; exit 1; }
          else
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "bycoda ${{ steps.version.outputs.version }}" --notes-file release-notes.md
          fi
          echo "id=$(gh release view "${GITHUB_REF_NAME}" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-package.yml
    with:
      release-id: ${{ needs.draft.outputs.release-id }}
      expected-sha: ${{ github.sha }}
      version: ${{ needs.draft.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # The reusable workflow builds portable JS/web once, then packages desktop
  # variants and all six standalone Host archives from that exact artifact.
