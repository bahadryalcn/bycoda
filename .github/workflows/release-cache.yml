name: Release cache

# Seed optimized dependencies on main, whose caches are readable by release
# tags. Keep the toolchain, target and shared-key aligned with release.yml.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release*.yml"
      - ".github/workflows/desktop-package.yml"
      - ".github/actions/setup-deps/**"
      - "scripts/release/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "vendor/**"
      - ".cargo/**"
      - "rust-toolchain*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --config src-tauri/tauri.fork.conf.json
          - platform: macos-latest
            args: --target aarch64-apple-darwin --config src-tauri/tauri.fork.macos.conf.json
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: cache
        with:
          shared-key: desktop-release-${{ matrix.platform }}
      - uses: ./.github/actions/setup-deps
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "22"
      - run: pnpm run host:package
        if: steps.cache.outputs.cache-hit != 'true'
      # Compile with the same Tauri configuration without installers, signing
      # credentials, draft creation or uploads. Only dependencies are cached.
      - name: Warm optimized desktop dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec tauri build --no-bundle ${{ matrix.args }}
