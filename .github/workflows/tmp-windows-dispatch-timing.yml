# TEMPORARY timing probe for the Windows engine-async-persistence slowdown. Removed after use.
name: TEMP Windows dispatch timing
on:
  push:
    branches: [claude/funny-lamport-uas0gu]
permissions:
  contents: read
jobs:
  timing:
    if: contains(github.event.head_commit.message, '[timing]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: 24
      - name: State fresh
        shell: pwsh
        run: ./scripts/tmp-timing/state.ps1 fresh
      - name: Timed slow file on fresh VM
        shell: pwsh
        continue-on-error: true
        env:
          BYCODA_TIMING_LOG: ${{ github.workspace }}\timing-fresh.log
        run: |
          $env:NODE_OPTIONS = "--import=" + ([Uri](Resolve-Path scripts/tmp-timing/preload.mjs).Path).AbsoluteUri
          pnpm exec vitest run --config host/vitest.config.ts host/engine-async-persistence.test.ts
      - name: Replay preceding shard-1 files in order
        shell: pwsh
        continue-on-error: true
        run: |
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/goals/goals.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/goals/goals.test.ts"; ./scripts/tmp-timing/state.ps1 after-goals.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/social/social-browser.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/social/social-browser.test.ts"; ./scripts/tmp-timing/state.ps1 after-social-browser.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/social/social-suggestions.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/social/social-suggestions.test.ts"; ./scripts/tmp-timing/state.ps1 after-social-suggestions.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/transport/ws/server.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/transport/ws/server.test.ts"; ./scripts/tmp-timing/state.ps1 after-server.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/social/social-browser-publishing.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/social/social-browser-publishing.test.ts"; ./scripts/tmp-timing/state.ps1 after-social-browser-publishing.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/git/git-actions.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/git/git-actions.test.ts"; ./scripts/tmp-timing/state.ps1 after-git-actions.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/assistant/voice/assistant-voice-context.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/assistant/voice/assistant-voice-context.test.ts"; ./scripts/tmp-timing/state.ps1 after-assistant-voice-context.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/crews/crew-authority.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/crews/crew-authority.test.ts"; ./scripts/tmp-timing/state.ps1 after-crew-authority.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/devices/device-host.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/devices/device-host.test.ts"; ./scripts/tmp-timing/state.ps1 after-device-host.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/sessions/session-file-revert.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/sessions/session-file-revert.test.ts"; ./scripts/tmp-timing/state.ps1 after-session-file-revert.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/store-db.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/store-db.test.ts"; ./scripts/tmp-timing/state.ps1 after-store-db.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
          $sw=[Diagnostics.Stopwatch]::StartNew(); pnpm exec vitest run --config host/vitest.config.ts host/domains/native-services/http-ws.test.ts --reporter=dot *> $null; Write-Output "$($sw.ElapsedMilliseconds)ms exit=$LASTEXITCODE host/domains/native-services/http-ws.test.ts"; ./scripts/tmp-timing/state.ps1 after-http-ws.test.ts | Select-String 'entries=|FOUND|git rev-parse|git ls-files|cpuLoad'
      - name: State after replay
        shell: pwsh
        run: ./scripts/tmp-timing/state.ps1 after-replay
      - name: Timed slow file after replay
        shell: pwsh
        continue-on-error: true
        env:
          BYCODA_TIMING_LOG: ${{ github.workspace }}\timing-slow.log
        run: |
          $env:NODE_OPTIONS = "--import=" + ([Uri](Resolve-Path scripts/tmp-timing/preload.mjs).Path).AbsoluteUri
          pnpm exec vitest run --config host/vitest.config.ts host/engine-async-persistence.test.ts
      - name: State after slow
        shell: pwsh
        run: ./scripts/tmp-timing/state.ps1 after-slow
      - name: Print timing logs
        if: always()
        shell: pwsh
        run: |
          Write-Output "===== FRESH ====="; Get-Content timing-fresh.log -ErrorAction SilentlyContinue
          Write-Output "===== SLOW ====="; Get-Content timing-slow.log -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tmp-dispatch-timing-${{ github.run_id }}
          path: timing-*.log
          retention-days: 3
