name: Advisory PR review scope
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: advisory-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Report passive diff metadata (advisory only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/checks/pr-review-report.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --output temp/test-results/pr-review/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advisory-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: temp/test-results/pr-review/report.json
          retention-days: 7
          if-no-files-found: error
