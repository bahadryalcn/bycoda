name: Opt-in deterministic task output cache
on:
  workflow_dispatch:
    inputs:
      enable:
        description: Explicitly exercise the deterministic inventory output cache.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inventory:
    if: inputs.enable && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          node-version: "24"
      - id: identity
        name: Verify complete deterministic inputs before cache lookup
        run: node scripts/checks/task-cache.mjs key --task repository-inventory
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: temp/task-output-cache/store
          key: task-output-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
      - name: Rehash restored output or execute the reviewed deterministic task
        run: >-
          node scripts/checks/task-cache.mjs run --task repository-inventory
          --store temp/task-output-cache/store --output temp/task-output-cache/result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deterministic-inventory-output
          path: temp/task-output-cache/result/
          retention-days: 7
          if-no-files-found: error
