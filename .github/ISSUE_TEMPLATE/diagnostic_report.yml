name: Diagnostic report
description: Share an optional, redacted investigation of a bycoda problem
labels: [bug, "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A normal bug report is also welcome. Only the problem description is required.
        Write in your preferred language; unknown versions and incomplete reproductions are fine.
        Remove credentials, pairing material and private project or conversation content.
        Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Issue description
      description: What happened, what did you expect, and what work is affected?
    validations:
      required: true
  - type: textarea
    id: affected-runtimes
    attributes:
      label: Affected runtimes (optional)
      description: Keep desktop, Host, provider and mobile identities separate. Use unknown when necessary.
      placeholder: |
        Desktop version/build, OS/architecture, installed or development:
        Host version/build and local/SSH/LAN route:
        Provider CLI/version:
        Mobile version/build, device or simulator:
        Investigator source commit and verified package inclusion:
  - type: textarea
    id: investigation
    attributes:
      label: Investigation and reproduction (optional)
      description: Separate observed facts from hypotheses. Include a small reproduction or workaround if available.
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence and checks (optional)
      description: Name source, browser fixture, package, installed, simulator, device or live-provider evidence, and checks that could not run.
  - type: textarea
    id: recovery
    attributes:
      label: Recovery and related reports (optional)
      description: Record safe workarounds and related reports. Do not delete live data or bypass update/session gates to reproduce a problem.
