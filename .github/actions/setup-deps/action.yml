name: Setup bycoda dependencies
description: Use the packageManager-pinned pnpm with explicit Node and cache identity.
inputs:
  node-version:
    description: Node major or exact version selected by the caller.
    required: true
  install:
    description: Set false for jobs that need Node without JavaScript dependencies.
    default: "true"
  cache-prefix:
    description: Store namespace; OS, architecture, Node, pnpm and install inputs are appended.
    default: bycoda-deps-v1
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Read pinned package manager
      id: manager
      if: inputs.install == 'true'
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from 'node:fs';
        const { packageManager } = JSON.parse(readFileSync('package.json', 'utf8'));
        const match = /^pnpm@(\d+\.\d+\.\d+)(?:\+sha\d+\.[a-zA-Z0-9]+)?$/.exec(packageManager ?? '');
        if (!match) throw new Error('package.json must pin an exact pnpm version');
        appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\n`);
        NODE
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      if: inputs.install == 'true'
      with:
        version: ${{ steps.manager.outputs.version }}
        run_install: false
    - name: Resolve pnpm store
      id: store
      if: inputs.install == 'true'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      # The isolated local runner already retains its own pnpm store. Avoid
      # downloading a remote tar over that warm store; frozen install still runs.
      if: inputs.install == 'true' && runner.environment != 'self-hosted'
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-pnpm${{ steps.manager.outputs.version }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', '.pnpmfile.cjs', 'patches/**') }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-pnpm${{ steps.manager.outputs.version }}-
    - name: Install frozen workspace dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
