<!doctype html>
<html lang="en">
  <body>
    <ytcp-app>
      <a id="channel-link" href="https://www.youtube.com/channel/UCabcdefghijklmnopqrstuv">Bycoda Fixture</a>
      <ytcp-channel-customization>
        <div id="channel-name"><input value="Original channel" /></div>
        <div id="channel-handle"><input value="original" /></div>
        <section id="links-section">
          <button id="add-link">Add link</button>
        </section>
        <section id="avatar-section">
          <img src="https://yt3.googleusercontent.com/old-avatar" alt="" />
          <input type="file" accept="image/jpeg,image/png" hidden />
        </section>
        <button id="publish-button">Publish</button>
      </ytcp-channel-customization>
    </ytcp-app>
  </body>
</html>
