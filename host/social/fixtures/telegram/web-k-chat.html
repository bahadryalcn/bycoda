<!-- Synthetic open direct chat. Bubbles are rendered by the test; messages here are fixture text only. -->
<div id="column-center">
  <div class="chat tabs-tab active">
    <div class="chat-info-container">
      <span class="peer-title" data-peer-id="{{peer}}">{{name}}</span>
    </div>
    <div class="bubbles"><div class="bubbles-inner">{{bubbles}}</div></div>
    <div class="chat-input">{{composer}}<button class="btn-send">Send</button></div>
  </div>
</div>
