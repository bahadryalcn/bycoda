<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bycoda — çay tabağı animasyonu</title>
    <style>
      body {
        margin: 0;
        padding: 40px 24px;
        background: #f5f5f5;
        color: #000;
        font:
          15px system-ui,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: auto;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
      }
      section {
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        border: 1px solid #ddd;
        border-radius: 16px;
        margin: 24px 0;
        padding: 48px 20px;
        min-height: 180px;
      }
      .symbol {
        width: 160px;
        height: 160px;
      }
      .lockup {
        width: min(100%, 650px);
        height: auto;
      }
      button {
        background: #000;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 12px 20px;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #d32030;
        outline-offset: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>bycoda / siyahtan kırmızıya</h1>
      <section>
        <img class="symbol" src="mark-tea-red-animated.svg" alt="bycoda çay tabağı simgesi" />
      </section>
      <section>
        <img class="lockup" src="logo-horizontal-tea-red-animated.svg" alt="bycoda yazılı logo" />
      </section>
      <button type="button" id="replay">Yeniden oynat</button>
    </main>
    <script>
      let replayCount = 0;
      document.getElementById("replay").addEventListener("click", () => {
        replayCount++;
        document.querySelectorAll("img").forEach((img) => {
          const clone = img.cloneNode(true);
          clone.src = img.getAttribute("src").split("?")[0] + "?replay=" + replayCount;
          img.replaceWith(clone);
        });
      });
    </script>
  </body>
</html>
