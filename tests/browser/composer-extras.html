      window.__TAURI_INTERNALS__ ??= {
        metadata: { currentWebview: { label: "fixture" }, currentWindow: { label: "fixture" } },

        unregisterCallback: () => {},

          if (command === "plugin:event|unlisten") return;
          throw new Error(`No native host in composer fixture: ${command}`);

      };
