<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bycoda citation integration fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      localStorage.setItem("bycoda.language", "en");
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWebview: { label: "fixture" }, currentWindow: { label: "fixture" } },
        transformCallback: () => 1,
        unregisterCallback: () => {},
        invoke: async (command, args) => {
          if (command === "plugin:event|listen") return 1;
          if (
            command === "plugin:clipboard-manager|write_text" ||
            command === "copy_text_to_clipboard"
          ) {
            if (window.fixtureClipboardFailure) throw new Error("Fixture clipboard unavailable");
            window.fixtureCopiedText = args.text;
          }
          return undefined;
        },
      };
    </script>
    <script type="module" src="./chat-citations.tsx"></script>
  </body>
</html>
