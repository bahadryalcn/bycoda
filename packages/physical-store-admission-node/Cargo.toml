[package]
name = "bycoda-physical-store-admission-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Private Node mechanical physical-file reservation port"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-probe = []

[dependencies]
bycoda-physical-store-admission = { path = "../physical-store-admission" }
napi = { version = "=3.15.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = { version = "=3.6.13", default-features = false, features = ["strict"] }

[build-dependencies]
napi-build = "=2.6.0"

[[bin]]
name = "physical-admission-probe"
path = "tests/support/probe.rs"
required-features = ["test-probe"]
test = false
bench = false
