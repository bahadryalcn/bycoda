[package]
name = "bycoda-physical-store-admission"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Mechanical physical-file writer reservation and closing fences"

[dependencies]
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
cap-primitives = "=4.0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
