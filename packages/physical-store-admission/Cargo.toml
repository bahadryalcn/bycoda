[package]
name = "bycoda-physical-store-admission"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Mechanical physical-file writer reservation and closing fences"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
