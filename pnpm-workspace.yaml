# The local update coordinator alone decides when dependencies need installation.
verifyDepsBeforeRun: false
# Accept the supported engines.pnpm range without switching to the build pin.
pmOnFail: ignore
packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  core-js: false
  "@ast-grep/cli": false
  "@openuidev/lang-core": false
minimumReleaseAgeExclude:
  - "@tsrs/darwin-arm64@7.1.0-beta.tsrs4"
  - "@tsrs/darwin-x64@7.1.0-beta.tsrs4"
  - "@tsrs/linux-arm64-gnu@7.1.0-beta.tsrs4"
  - "@tsrs/linux-arm64-musl@7.1.0-beta.tsrs4"
  - "@tsrs/linux-x64-gnu@7.1.0-beta.tsrs4"
  - "@tsrs/linux-x64-musl@7.1.0-beta.tsrs4"
  - "@tsrs/win32-arm64@7.1.0-beta.tsrs4"
  - "@tsrs/win32-x64@7.1.0-beta.tsrs4"
  - tsrs@7.1.0-beta.tsrs4
