# The local update coordinator alone decides when dependencies need installation.
verifyDepsBeforeRun: false
# Accept the supported engines.pnpm range without switching to the build pin.
pmOnFail: ignore
packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  core-js: false
  tsc-rs: true
  "@ast-grep/cli": false
minimumReleaseAgeExclude:
  - "@tsc-rs/darwin-arm64@0.8.0"
  - "@tsc-rs/darwin-x64@0.8.0"
  - "@tsc-rs/linux-arm64@0.8.0"
  - "@tsc-rs/linux-x64@0.8.0"
  - "@tsc-rs/win32-arm64@0.8.0"
  - "@tsc-rs/win32-x64@0.8.0"
  - tsc-rs@0.8.0
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0
