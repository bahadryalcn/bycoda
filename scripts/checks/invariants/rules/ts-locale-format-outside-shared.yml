id: ts-locale-format-outside-shared
language: tsx
severity: error
message: "Format dates, times, numbers, byte sizes and durations through the shared helpers so every surface agrees on locale, calendar day and density: formatDate / formatNumber (src/shared/i18n/core.ts), formatRelativeTime / formatBytes / formatDuration (src/shared/i18n/format.ts), dateTimeFormat / relativeTimeFormat (src/shared/lib/intl.ts) or the <Timestamp> component. Direct toLocale*String / new Intl.*Format calls belong only in those helpers."
note: Rule K-INTL in docs/reference/code-invariants.md
files:
  - "src/**"
ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "src/shared/lib/intl.ts"
  - "src/shared/lib/numbers.ts"
  - "src/shared/lib/time/**"
  - "src/shared/ui/**"
  - "src/shared/i18n/**"
rule:
  any:
    - pattern: $X.toLocaleDateString($$$)
    - pattern: $X.toLocaleTimeString($$$)
    - pattern: $X.toLocaleString($$$)
    - pattern: new Intl.DateTimeFormat($$$)
    - pattern: new Intl.RelativeTimeFormat($$$)
    - pattern: new Intl.NumberFormat($$$)
    - pattern: Intl.DateTimeFormat($$$)
    - pattern: Intl.NumberFormat($$$)
