id: ts-date-toisostring-unguarded
language: tsx
severity: error
message: "`new Date(value).toISOString()` throws a RangeError on an invalid date and takes the whole React tree down. Use `isoTimestamp(value)` from src/shared/lib/time/timestamps.ts, which returns undefined for invalid input."
note: Rule K-DATE in docs/reference/code-invariants.md
files:
  - "src/**"
  - "host/**"
ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "src/shared/lib/time/**"
rule:
  pattern: new Date($VALUE).toISOString()
