id: rust-accept-inherits-nonblocking
language: rust
severity: error
message: "On macOS and Windows a socket returned by `accept()` inherits the listener's non-blocking mode. Call `socket.set_nonblocking(false)` (and set read/write timeouts) in the `Ok` arm before handing the socket to a blocking handler; otherwise reads spin on WouldBlock and writes truncate responses."
note: Rule K-SOCKET in docs/reference/code-invariants.md
files:
  - "src-tauri/src/**"
ignores:
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  kind: match_arm
  all:
    - has:
        field: pattern
        regex: "^Ok\\s*\\("
    - inside:
        kind: match_expression
        stopBy: end
        has:
          field: value
          pattern: $LISTENER.accept()
    - not:
        has:
          pattern: $SOCKET.set_nonblocking(false)
          stopBy: end
