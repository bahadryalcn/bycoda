id: ts-suppression-without-reason
language: tsx
severity: error
message: "A suppression comment needs a reason so the next reader can tell a justified exception from a silenced defect. Append ` -- <why this line is safe>` in the same comment, for example `// oxlint-disable-next-line no-restricted-imports -- scratch file, not read at startup`."
note: Rule K-SUPPRESS in docs/reference/code-invariants.md
files:
  - "src/**"
  - "host/**"
  - "packages/**"
ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/test-support/**"
rule:
  kind: comment
  # The directive must open the comment (after the comment marker), so prose that merely
  # mentions a directive does not match.
  regex: '^(//+|/\*+)\s*(oxlint-disable|eslint-disable|ast-grep-ignore|@ts-expect-error|@ts-ignore)'
  not:
    regex: '\s--\s+\S'
