id: ts-void-promise-without-catch
language: tsx
severity: error
message: "A `void`-discarded promise with no rejection handler becomes an unhandled rejection; the Host logs it through guardUnhandledRejections (host/server/support.ts) and marks the service degraded, and the failed work is silently lost. Append `.catch(...)` that logs or reports (a `.finally()` alone does not handle the rejection), pass a rejection handler as the second `then` argument, or await it inside a try/catch (an async IIFE whose body has a try/catch is fine)."
note: Rule K-ASYNC in docs/reference/code-invariants.md
# Host only: there an unhandled rejection degrades the service. In the renderer it is
# only logged (src/features/diagnostics/model/uiLogBuffer.ts), so `src/**` is out of scope.
files:
  - "host/**"
  - "packages/**"
ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/test-support/**"
rule:
  pattern: void $CALL
constraints:
  CALL:
    kind: call_expression
    not:
      any:
        - pattern: $P.catch($$$)
        - pattern: $P.then($ON_FULFILLED, $ON_REJECTED)
        # `.catch(...).finally(...)`: the rejection is handled before the finally.
        - all:
            - pattern: $P.finally($$$)
            - has:
                field: function
                has:
                  field: object
                  any:
                    - pattern: $Q.catch($$$)
                    - pattern: $Q.then($A, $B)
        - all:
            - pattern: (async ($$$ARGS) => $BODY)()
            - has:
                kind: try_statement
                stopBy: end
                has:
                  kind: catch_clause
