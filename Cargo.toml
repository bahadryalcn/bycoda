[workspace]
resolver = "2"
members = [
  "src-tauri",
  "packages/physical-store-admission",
  "packages/physical-store-admission-node",
  "packages/provider-process-guardian",
]
exclude = ["vendor/portable-pty"]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
# Unwinding stays on: lock-poison recovery depends on it.
lto = "thin"
codegen-units = 1
strip = true
